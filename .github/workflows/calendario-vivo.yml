
name: Atualizar Calendário Vivo

on:
  schedule:
    - cron: "5 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-banner:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar calendário
        run: python atualizar_calendario.py

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza banner do calendário"
            git push
          else
            echo "Nenhuma alteração no README."
          fi